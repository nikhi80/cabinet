
name: Build Cabinet APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev \
            libssl-dev automake autopoint gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install "cython==0.29.36" buildozer

      - name: Accept Android licenses and install Build-Tools
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK"
          if [ ! -f "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Android SDK command-line tools are missing."
            exit 1
          fi
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" "build-tools;35.0.0"

      - name: Build Cabinet APK
        working-directory: Cabinet
        run: yes | buildozer -v android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Cabinet-APK
          path: Cabinet/bin/*.apk
          if-no-files-found: error
          retention-days: 7
