
name: Build Cabinet APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev \
            libssl-dev automake autopoint gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade "pip<23" setuptools
          python -m pip install "cython==0.29.36" buildozer

      - name: Build Cabinet APK
        id: build
        continue-on-error: true
        working-directory: Cabinet
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Find Android manifest error
        if: always()
        working-directory: Cabinet
        run: |
          echo "========== MANIFEST ERRORS =========="

          if [ -f build.log ]; then
            grep -n -B 25 -A 40 -E \
              'ManifestMerger|manifest merger failed|AndroidManifest.xml|ParseError|What went wrong|Execution failed|Caused by:|error:' \
              build.log || true
          fi

          echo "========== MANIFEST MERGER REPORTS =========="

          find .buildozer -type f \
            \( -iname '*manifest*report*' -o -iname '*manifest*log*' \) \
            -print 2>/dev/null || true

          echo "========== CUSTOM MANIFEST SETTINGS =========="

          grep -R -n \
            --exclude-dir=.git \
            --exclude-dir=.buildozer \
            --exclude-dir=bin \
            -E 'DoseAlarmReceiver|DoseBootReceiver|extra_manifest' \
            . || true

      - name: Upload APK
        if: success() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Cabinet-APK
          path: Cabinet/bin/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Mark build as failed
        if: steps.build.outcome == 'failure'
        run: exit 1
