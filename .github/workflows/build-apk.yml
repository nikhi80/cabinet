```yaml
name: Build Cabinet APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev \
            libssl-dev automake autopoint gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade "pip<23" setuptools
          python -m pip install "cython==0.29.36" buildozer

      - name: Check Android manifest configuration
        working-directory: Cabinet
        run: |
          echo "Checking repository files for custom manifest arguments..."
          grep -R -n \
            --exclude-dir=.git \
            --exclude-dir=.buildozer \
            --exclude-dir=bin \
            -E 'extra-manifest-xml|extra-manifest-application-arguments|android\.extra_manifest_xml|android\.extra_manifest_application_arguments' \
            . || true

      - name: Build Cabinet APK
        working-directory: Cabinet
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show manifest errors if build fails
        if: failure()
        working-directory: Cabinet
        run: |
          if [ -f build.log ]; then
            echo "========== ANDROID MANIFEST / GRADLE ERRORS =========="
            grep -n -B 10 -A 15 -E \
              'ManifestMerger|Error parsing|AndroidManifest\.xml|ParseError|failed to parse|processDebugMainManifest|AAPT:|What went wrong:|FAILURE: Build failed' \
              build.log || true

            echo "========== LAST 150 LOG LINES =========="
            tail -n 150 build.log
          else
            echo "build.log was not created."
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Cabinet-APK
          path: Cabinet/bin/*.apk
          if-no-files-found: error
          retention-days: 7
```
